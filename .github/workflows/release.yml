name: Release

# Tags build an official release. Every push to production (or a manual run on it) builds the
# same installers and refreshes the rolling "experimental" pre-release instead.
on:
  push:
    tags:
      - "v*"
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/production' }}

permissions:
  contents: write

jobs:
  guard:
    name: Release only from production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the commit to be on the production branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git fetch --no-tags origin production
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/production; then
              echo "Tag $GITHUB_REF_NAME is not on the production branch. Merge main into production first, then tag the production commit."
              exit 1
            fi
          elif [ "$GITHUB_REF" != "refs/heads/production" ]; then
            echo "Run this workflow from the production branch (it ran from $GITHUB_REF)."
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[desktop,pack]"

      - name: Verify tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY="$(python -c "from core.version import read_pyproject_version; print(read_pyproject_version())")"
          if [ "$TAG" != "$PY" ]; then
            echo "Tag v$TAG does not match pyproject.toml version $PY"
            exit 1
          fi

      - name: Verify release notes exist
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Missing $NOTES — add release notes before tagging."
            exit 1
          fi

      - name: Label experimental builds
        if: github.ref == 'refs/heads/production'
        shell: bash
        run: |
          VERSION="$(python -c "from core.version import read_pyproject_version; print(read_pyproject_version())")"
          echo "TOOLBOX_BUNDLED_VERSION=${VERSION}-exp.${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Sync frontend package version
        shell: bash
        run: |
          VERSION="$(python -c "from core.version import read_pyproject_version; print(read_pyproject_version())")"
          npm pkg set "version=${VERSION}" --prefix web/frontend

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Render app icons
        run: python packaging/icons/render_icons.py

      - name: PyInstaller bundle
        run: pyinstaller packaging/toolbox.spec --noconfirm --clean

      - name: Platform installer
        shell: bash
        run: |
          VERSION="$(python -c "from core.version import read_pyproject_version; print(read_pyproject_version())")"
          case "${{ runner.os }}" in
            Windows)
              choco install innosetup -y
              # Git Bash rewrites /D... switches as paths; pass them through unchanged.
              MSYS2_ARG_CONV_EXCL='*' iscc "/DMyAppVersion=${VERSION}" packaging/windows/setup.iss
              ;;
            macOS) bash packaging/macos/build-dmg.sh "$VERSION" ;;
            Linux)
              sudo apt-get update
              sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 fuse libfuse2 librsvg2-bin
              wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
              chmod +x appimagetool
              sudo mv appimagetool /usr/local/bin/appimagetool
              bash packaging/linux/build-appimage.sh "$VERSION"
              ;;
          esac

      - name: List installers
        shell: bash
        run: ls -la packaging/dist/ || dir packaging\\dist

      - name: Upload release installer
        uses: actions/upload-artifact@v6
        with:
          name: toolbox-${{ matrix.os }}
          path: packaging/dist/Toolbox-*
          if-no-files-found: error
          compression-level: 6

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - name: Verify release notes exist
        shell: bash
        run: |
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Missing $NOTES"
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          pattern: toolbox-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded installers
        run: ls -laR artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Toolbox ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  experimental:
    name: Publish experimental pre-release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v7
        with:
          pattern: toolbox-*
          path: artifacts
          merge-multiple: true

      - name: Replace the experimental pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read pyproject.toml directly: importing core needs the app's dependencies, which this job lacks.
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          BUILD="${VERSION}-exp.${GITHUB_SHA::7}"
          {
            echo "build: ${BUILD}"
            echo
            echo "Experimental build of the production branch at ${GITHUB_SHA}. This is not an official release."
            echo "Turn on Experimental builds under Updates to receive it."
          } > notes.md
          gh release delete experimental --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create experimental artifacts/*             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --prerelease             --title "Experimental ${BUILD}"             --notes-file notes.md
