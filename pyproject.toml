[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "3.6.0"
description = "Cross-platform desktop app for local video conversion, library organization, and downloads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.0.0",
    "yt-dlp-ejs>=0.8.0",
    "openai>=1.0.0",
    # Talks to Anthropic and Gemini directly (see core/ai); already installed with openai.
    "httpx>=0.27.0",
    # yt-dlp's optional TLS bundle; no longer pulled in transitively (openai 3.x uses truststore).
    "certifi>=2024.0.0",
]

[project.urls]
Homepage = "https://toolbox.murly.nl"
Repository = "https://github.com/MerlijndeVos/Toolbox"
Issues = "https://github.com/MerlijndeVos/Toolbox/issues"
Changelog = "https://github.com/MerlijndeVos/Toolbox/releases"

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]
desktop = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pywebview>=5.0",
]
dev = []
pack = [
    "pyinstaller>=6.0",
    "pillow>=10.0",
]

[project.scripts]
toolbox = "cli.__main__:main"
toolbox-web = "web.__main__:main"
toolbox-app = "web.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "web*", "builtin_mods*"]

[tool.setuptools.package-data]
builtin_mods = ["*/mod.toml", "*/*.py"]

[tool.setuptools]
py-modules = ["app"]
